<!DOCTYPE html><html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google kalendář — Termínátor</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif;
         max-width: 26rem; margin: 0 auto; min-height: 100svh;
         display: flex; flex-direction: column; justify-content: center;
         padding: 2rem 1.25rem; text-align: center; line-height: 1.55;
         color: #1a1a1a; background: #fff; }
  .mark { font-size: 3.25rem; line-height: 1; margin-bottom: .75rem; }
  h1 { color: #8E2430; font-size: 1.4rem; margin: 0 0 .6rem; }
  p { margin: 0 0 .75rem; }
  .hint { color: #666; font-size: .95rem; }
  .fail h1 { color: #8E2430; }
  @media (prefers-color-scheme: dark) {
    body { color: #f2f2f2; background: #161616; }
    h1 { color: #ff8a95; }
    .hint { color: #a5a5a5; }
  }
</style>
</head><body>

<!-- Bez parametru (nebo ?stav=ok) je to úspěch; edge funkce přesměruje sem
     s ?stav=... podle toho, jak propojení dopadlo. Texty přepíná skript
     níž, ať je stránka jedna a nemusí se udržovat ve třech kopiích. -->
<div class="mark" id="mark">✅</div>
<h1 id="nadpis">Kalendář propojen</h1>
<p id="popis">Tvoje budoucí starty se do pár minut objeví v kalendáři
  <strong>Termínátor</strong>.</p>
<p class="hint">Tuhle záložku můžeš zavřít a vrátit se do appky.</p>

<script>
  var stavy = {
    ok: ["✅", "Kalendář propojen",
      "Tvoje budoucí starty se do pár minut objeví v kalendáři <strong>Termínátor</strong>."],
    zruseno: ["🚫", "Propojení zrušeno",
      "V Googlu jsi souhlas nedal(a), takže se nic nepropojilo. Zkusit to můžeš kdykoli znovu v Nastavení."],
    odkaz: ["⌛", "Odkaz už neplatí",
      "Odkaz vypršel nebo byl použitý. Otevři propojení znovu z Nastavení v appce."],
    google: ["⚠️", "Google neodpověděl",
      "Komunikace s Googlem se nepovedla. Zkus propojení za chvíli znovu."],
    kalendar: ["⚠️", "Kalendář se nezaložil",
      "Účet je propojený, ale kalendář se nepodařilo vytvořit. Zkus to prosím za chvíli znovu z Nastavení."],
    chyba: ["⚠️", "Něco se pokazilo",
      "Zkus propojení za chvíli znovu z Nastavení v appce."]
  };
  var klic = new URLSearchParams(location.search).get("stav") || "ok";
  var s = stavy[klic] || stavy.chyba;
  document.getElementById("mark").textContent = s[0];
  document.getElementById("nadpis").textContent = s[1];
  document.getElementById("popis").innerHTML = s[2];
  if (klic !== "ok") document.body.classList.add("fail");
  document.title = s[1] + " — Termínátor";
</script>

</body></html>
